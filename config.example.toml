# Glowbe runtime — copy to `config.toml` and edit as needed (2.4 GHz LAN).
#
# Devices live in `assets/devices.json` (Git-ignored). On first run, if that file
# is missing, the runtime creates it with two demo entries (15 / 60 panels), same
# as `assets/devices.json.example`. Edit in Studio or by hand; use mdnsHostname
# (service `_glowbe._udp`) or espIp when discovery is unavailable.

[assets]
# Defaults: repo `assets/compiled`, `assets/clips`, `assets/uploads`, …
# compiled_dir = "/var/lib/glowbe/compiled"
# clips_dir = "/var/lib/glowbe/clips"
# uploads_dir = "/var/lib/glowbe/uploads"

[output]
udp_port = 49152
status_port = 49153

[modes]
default = "idle"

[server]
bind = "0.0.0.0:8748"
