# Glowbe runtime — copy to config.toml and edit as needed (2.4 GHz LAN)

[device]
# esp_ip を省略または空にすると、同一 LAN で mDNS `_glowbe._udp` を探索する。
# esp_ip = "192.168.x.x"
layout_id = "geodesic-2v-60"
# layout_id = "icosahedron-15"

[assets]
# 省略時: リポジトリの assets/compiled（カレントから上位に `assets/compiled` を探索）
# compiled_dir = "/var/lib/glowbe/compiled"
# 省略時: リポジトリの assets/clips
# clips_dir = "/var/lib/glowbe/clips"
# 省略時: リポジトリの assets/uploads（POST /api/v1/media/upload の一時保存）
# uploads_dir = "/var/lib/glowbe/uploads"

[output]
udp_port = 49152
status_port = 49153

[modes]
default = "idle"

[server]
bind = "0.0.0.0:8080"
