; Glowbe firmware — prototype layout (225 LEDs, 5 data lines)
;
; Before build: cp include/wifi_config.h.example include/wifi_config.h
;
;   prototype       — ESP32-S3: LCD (I8080) + DMA multi-pin parallel (FastLED)
;   prototype-esp32 — ESP32 classic: RMT per data line (FastLED)

[platformio]
default_envs = prototype

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    fastled/FastLED @ ^3.7.8
upload_speed = 921600

; ESP32-S3 — LCD peripheral DMA parallel (FastLED FASTLED_USES_ESP32S3_I2S)
; Requires Arduino-ESP32 3.x / IDF 5.x (esp_memory_utils.h). See FastLED PlatformIO-Starter.
[env:prototype]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_src_filter =
    +<*>
    -<led_driver_esp32.cpp>

; ESP32 (classic) — standard RMT per GPIO
[env:prototype-esp32]
platform = espressif32 @ 7.0.1
board = esp32dev
build_src_filter =
    +<*>
    -<led_driver_s3.cpp>

[env:product]
extends = env:prototype
build_flags =
    ${env:prototype.build_flags}
    -DGLOWBE_BUILD_PRODUCT=1
