; Glowbe firmware — prototype layout (225 LEDs, 5 data lines)
;
; Before build: cp include/wifi_config.h.example include/wifi_config.h
;
;   prototype       — ESP32-S3: NeoPixelBus LCD ペリフェラル並列（X8/X16）
;   prototype-esp32 — ESP32 無印: NeoPixelBus I2S0 並列（X8/X16）

[platformio]
default_envs = prototype

[env]
framework = arduino
monitor_speed = 115200
; プレイアウト（ジッタバッファ）既定値は include/glowbe_playout.h 参照。上書き例:
;   -D GLOWBE_PLAYOUT_LAG_FRAMES=0
;   -D GLOWBE_PLAYOUT_RING_CAP=12
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    makuna/NeoPixelBus @ ^2.8.4
upload_speed = 921600

; ESP32-S3 — NeoPixelBus LCD + DMA マルチチャンネル（`NeoEsp32LcdX8Ws2812xMethod` / X16）
[env:prototype]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_src_filter =
    +<*>
    -<led_driver_esp32.cpp>

; ESP32（無印）— NeoPixelBus I2S0 並列（`NeoEsp32I2s0X8Ws2812xMethod` / X16）
[env:prototype-esp32]
platform = espressif32 @ 7.0.1
board = esp32dev
build_src_filter =
    +<*>
    -<led_driver_s3.cpp>

[env:product]
extends = env:prototype
build_flags =
    ${env:prototype.build_flags}
    -DGLOWBE_BUILD_PRODUCT=1
