; Glowbe firmware — layout headers under include/generated/<layout-id>/glowbe_layout.h
; (run: npx tsx tools/layout-compile.ts config/layouts/<name>.layout.json)
;
; Before build: cp include/wifi_config.h.example include/wifi_config.h
;
;   prototype / prototype-esp32 — prototype-icosahedron-15 (225 LEDs, 5 lines)
;   product / product-esp32     — product-geodesic-2v-60 (1260 LEDs, 10 lines)
;   product-s3-dev              — 同上・Freenove 等向け安全 GPIO（19/25 等を避ける）
;   *-rainbow                  — Wi-Fi なし虹色テスト（test/rainbow/）

[platformio]
default_envs = prototype

[env]
framework = arduino
monitor_speed = 115200
; プレイアウト（ジッタバッファ）既定値は include/glowbe_playout.h 参照。上書き例:
;   -D GLOWBE_PLAYOUT_LAG_FRAMES=0
;   -D GLOWBE_PLAYOUT_RING_CAP=12
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    makuna/NeoPixelBus @ ^2.8.4
upload_speed = 921600

; ESP32-S3 — NeoPixelBus LCD + DMA マルチチャンネル（`NeoEsp32LcdX8Ws2812xMethod` / X16）
; Freenove ESP32-S3 WROOM は N8R8（8MB PSRAM）。product（1260 LED）では PSRAM 必須。
; PSRAM なし DevKitC-1 N8 のみの場合は product を載せないこと。
[env:prototype]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -I include/generated/prototype-icosahedron-15
    -I include
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
build_src_filter =
    +<*>
    -<led_driver_esp32.cpp>

; ESP32（無印）— NeoPixelBus I2S0 並列（`NeoEsp32I2s0X8Ws2812xMethod` / X16）
[env:prototype-esp32]
platform = espressif32 @ 7.0.1
board = esp32dev
build_flags =
    -I include/generated/prototype-icosahedron-15
    -I include
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<*>
    -<led_driver_s3.cpp>

[env:product]
extends = env:prototype
build_flags =
    -I include/generated/product-geodesic-2v-60
    -I include
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DGLOWBE_PLAYOUT_LAG_FRAMES=0

[env:product-s3-dev]
extends = env:product
build_flags =
    -I include/generated/product-geodesic-2v-60-s3-dev
    -I include
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DGLOWBE_PLAYOUT_LAG_FRAMES=0

; Wi-Fi なし虹色テスト — S3 + product-s3-dev（Freenove 等の安全 GPIO）
[env:product-s3-dev-rainbow]
extends = env:product-s3-dev
build_flags =
    ${env:product-s3-dev.build_flags}
    -I test/rainbow
build_src_filter =
    -<*>
    +<led_driver_s3.cpp>
    +<../test/rainbow/>

; Wi-Fi なし虹色テスト — S3 + 製品 PCB GPIO
[env:product-rainbow]
extends = env:product
build_flags =
    ${env:product.build_flags}
    -I test/rainbow
build_src_filter =
    -<*>
    +<led_driver_s3.cpp>
    +<../test/rainbow/>

; Wi-Fi なし虹色テスト — ESP32 無印 + 製品レイアウト（1260 LED・RAM 不足の場合あり）
[env:product-esp32-rainbow]
extends = env:product-esp32
build_flags =
    ${env:product-esp32.build_flags}
    -I test/rainbow
build_src_filter =
    -<*>
    +<led_driver_esp32.cpp>
    +<../test/rainbow/>

[env:product-esp32]
extends = env:prototype-esp32
build_flags =
    -I include/generated/product-geodesic-2v-60
    -I include
    -DCORE_DEBUG_LEVEL=0
    -DGLOWBE_PLAYOUT_LAG_FRAMES=0
