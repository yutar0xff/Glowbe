; Glowbe firmware — layout headers under include/generated/<layout-id>/glowbe_layout.h
; (run: npx tsx tools/layout-compile.ts config/layouts/presets/<name>.layout.json)
;
; Before build: cp include/wifi_config.h.example include/wifi_config.h
;
;   15panels — icosahedron-15 (225 LEDs, 5 lines)
;   60panels — geodesic-2v-60 (1260 LEDs, 10 lines)
;   *-rainbow — Wi-Fi なし虹色テスト（test/rainbow/）

[platformio]
default_envs = 15panels

[env]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; プレイアウト（ジッタバッファ）既定値は include/glowbe_playout.h 参照。上書き例:
;   -D GLOWBE_PLAYOUT_LAG_FRAMES=0
;   -D GLOWBE_PLAYOUT_RING_CAP=12
build_flags =
    -I include
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    makuna/NeoPixelBus @ ^2.8.4
upload_speed = 921600

; ESP32 — NeoPixelBus I2S0 並列（`NeoEsp32I2s0X8Ws2812xMethod` / X16）
[env:15panels]
build_flags =
    ${env.build_flags}
    -I include/generated/icosahedron-15

[env:60panels]
extends = env:15panels
build_flags =
    ${env.build_flags}
    -I include/generated/geodesic-2v-60
    -DGLOWBE_PLAYOUT_LAG_FRAMES=0

[env:15panels-rainbow]
extends = env:15panels
build_flags =
    ${env.build_flags}
    -I include/generated/icosahedron-15
    -I test/rainbow
build_src_filter =
    -<*>
    +<led_driver.cpp>
    +<../test/rainbow/>

[env:60panels-rainbow]
extends = env:60panels
build_flags =
    ${env.build_flags}
    -I include/generated/geodesic-2v-60
    -I test/rainbow
build_src_filter =
    -<*>
    +<led_driver.cpp>
    +<../test/rainbow/>
