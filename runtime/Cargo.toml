[package]
name = "glowbe-runtime"
version = "0.1.0"
edition = "2021"
description = "Glowbe server-authoritative LED runtime"

[dependencies]
anyhow = "1"
axum = "0.8"
flume = "0.11"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
